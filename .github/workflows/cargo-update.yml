name: Cargo Update

on:
  schedule:
    - cron: "0 4 * * *" # trigger two hours before Dependabot to avoid duplicate work
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: pr-creator

    # https://github.com/orgs/community/discussions/65321#discussioncomment-8003574
    env:
      GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo update
        run: cargo update

      - name: Check for lockfile changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git checkout -B automation/cargo-update
          git add Cargo.lock
          git commit -m "chore: cargo update"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: git push --force origin automation/cargo-update

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          if gh pr view automation/cargo-update >/dev/null 2>&1; then
            gh pr edit automation/cargo-update --title "chore: cargo update" --body "Automated \`cargo update\` run."
          else
            gh pr create --base main --head automation/cargo-update --title "chore: cargo update" --body "Automated \`cargo update\` run."
          fi

      - name: Enable auto-merge
        if: steps.changes.outputs.changed == 'true'
        run: |
          PR_URL=$(gh pr view automation/cargo-update --json url --jq .url)
          gh pr merge --auto --rebase --delete-branch "$PR_URL"

      - name: No changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "Cargo.lock already up to date."
